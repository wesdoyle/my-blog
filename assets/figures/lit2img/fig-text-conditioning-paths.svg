<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" role="img" aria-label="One block of the diffusion transformer with its three conditioning entry points. The timestep passes through an adaLN-Zero MLP that produces scale and shift for each layer norm and a gate for each residual addition; the gates start at zero so the block begins as an identity. The caption passes through a frozen CLIP encoder and a zero-initialized projection, and enters as keys and values of the cross-attention sub-block. Image tokens flow left to right through layer norm, self-attention, layer norm, cross-attention, layer norm and an MLP, with residual connections around each." font-family="Archivo, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" fill="currentColor">
<defs>
<marker id="dt-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker>
<marker id="dt-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#15897A"/></marker>
</defs>
<text x="760" y="14" text-anchor="end" font-size="10.5" opacity="0.6">one of 12 identical blocks</text>
<!-- timestep path -->
<rect x="70" y="40" width="40" height="22" rx="11" fill="none" stroke="currentColor"/>
<text x="90" y="55" text-anchor="middle">t</text>
<line x1="110" y1="51" x2="138" y2="51" stroke="currentColor" stroke-width="1.25" marker-end="url(#dt-a)"/>
<rect x="140" y="34" width="160" height="36" rx="3" fill="none" stroke="currentColor"/>
<text x="220" y="49" text-anchor="middle" font-weight="600">adaLN-Zero MLP</text>
<text x="220" y="63" text-anchor="middle" font-size="10" opacity="0.7">t → γ, β, α for each sub-block</text>
<line x1="220" y1="70" x2="220" y2="100" stroke="currentColor" stroke-opacity="0.5"/>
<line x1="90" y1="100" x2="616" y2="100" stroke="currentColor" stroke-opacity="0.35"/>
<line x1="90" y1="100" x2="90" y2="168" stroke="currentColor" stroke-opacity="0.6" marker-end="url(#dt-a)"/>
<line x1="288" y1="100" x2="288" y2="168" stroke="currentColor" stroke-opacity="0.6" marker-end="url(#dt-a)"/>
<line x1="486" y1="100" x2="486" y2="168" stroke="currentColor" stroke-opacity="0.6" marker-end="url(#dt-a)"/>
<line x1="240" y1="100" x2="240" y2="176" stroke="#15897A" stroke-width="1.25" marker-end="url(#dt-b)"/>
<line x1="438" y1="100" x2="438" y2="176" stroke="#15897A" stroke-width="1.25" marker-end="url(#dt-b)"/>
<line x1="616" y1="100" x2="616" y2="176" stroke="#15897A" stroke-width="1.25" marker-end="url(#dt-b)"/>
<text x="634" y="96" font-size="10.5" opacity="0.75">γ, β → scale, shift each LN</text>
<text x="634" y="111" font-size="10.5" font-weight="600" fill="#15897A">α → gate each +, zero-init</text>
<text x="634" y="125" font-size="10" opacity="0.65">so the block starts as identity</text>
<!-- image token path -->
<text x="10" y="192">tokens</text>
<line x1="50" y1="188" x2="68" y2="188" stroke="currentColor" stroke-width="1.25" marker-end="url(#dt-a)"/>
<rect x="70" y="170" width="40" height="36" rx="3" fill="none" stroke="currentColor"/>
<text x="90" y="192" text-anchor="middle">LN</text>
<line x1="110" y1="188" x2="122" y2="188" stroke="currentColor" stroke-width="1.25" marker-end="url(#dt-a)"/>
<rect x="124" y="170" width="96" height="36" rx="3" fill="none" stroke="currentColor"/>
<text x="172" y="192" text-anchor="middle">self-attn</text>
<line x1="220" y1="188" x2="228" y2="188" stroke="currentColor" stroke-width="1.25" marker-end="url(#dt-a)"/>
<circle cx="240" cy="188" r="10" fill="none" stroke="currentColor"/>
<text x="240" y="192.5" text-anchor="middle" font-size="13" font-weight="600">+</text>
<line x1="250" y1="188" x2="266" y2="188" stroke="currentColor" stroke-width="1.25" marker-end="url(#dt-a)"/>
<rect x="268" y="170" width="40" height="36" rx="3" fill="none" stroke="currentColor"/>
<text x="288" y="192" text-anchor="middle">LN</text>
<line x1="308" y1="188" x2="320" y2="188" stroke="currentColor" stroke-width="1.25" marker-end="url(#dt-a)"/>
<rect x="322" y="170" width="96" height="36" rx="3" fill="#15897A" fill-opacity="0.1" stroke="#15897A" stroke-width="1.25"/>
<text x="370" y="192" text-anchor="middle" font-weight="600">cross-attn</text>
<line x1="418" y1="188" x2="426" y2="188" stroke="currentColor" stroke-width="1.25" marker-end="url(#dt-a)"/>
<circle cx="438" cy="188" r="10" fill="none" stroke="currentColor"/>
<text x="438" y="192.5" text-anchor="middle" font-size="13" font-weight="600">+</text>
<line x1="448" y1="188" x2="464" y2="188" stroke="currentColor" stroke-width="1.25" marker-end="url(#dt-a)"/>
<rect x="466" y="170" width="40" height="36" rx="3" fill="none" stroke="currentColor"/>
<text x="486" y="192" text-anchor="middle">LN</text>
<line x1="506" y1="188" x2="518" y2="188" stroke="currentColor" stroke-width="1.25" marker-end="url(#dt-a)"/>
<rect x="520" y="170" width="76" height="36" rx="3" fill="none" stroke="currentColor"/>
<text x="558" y="192" text-anchor="middle">MLP</text>
<line x1="596" y1="188" x2="604" y2="188" stroke="currentColor" stroke-width="1.25" marker-end="url(#dt-a)"/>
<circle cx="616" cy="188" r="10" fill="none" stroke="currentColor"/>
<text x="616" y="192.5" text-anchor="middle" font-size="13" font-weight="600">+</text>
<line x1="626" y1="188" x2="660" y2="188" stroke="currentColor" stroke-width="1.25" marker-end="url(#dt-a)"/>
<text x="668" y="192">out</text>
<path d="M56,188 V232 H240 V200" fill="none" stroke="currentColor" stroke-opacity="0.4" marker-end="url(#dt-a)"/>
<path d="M256,188 V232 H438 V200" fill="none" stroke="currentColor" stroke-opacity="0.4" marker-end="url(#dt-a)"/>
<path d="M454,188 V232 H616 V200" fill="none" stroke="currentColor" stroke-opacity="0.4" marker-end="url(#dt-a)"/>
<text x="148" y="246" text-anchor="middle" font-size="10" opacity="0.55">residual</text>
<!-- text path -->
<rect x="70" y="298" width="90" height="30" rx="3" fill="none" stroke="currentColor"/>
<text x="115" y="317" text-anchor="middle">caption</text>
<line x1="160" y1="313" x2="188" y2="313" stroke="currentColor" stroke-width="1.25" marker-end="url(#dt-a)"/>
<rect x="190" y="298" width="110" height="30" rx="3" fill="none" stroke="currentColor"/>
<text x="245" y="317" text-anchor="middle">CLIP, frozen</text>
<line x1="300" y1="313" x2="328" y2="313" stroke="currentColor" stroke-width="1.25" marker-end="url(#dt-a)"/>
<rect x="330" y="298" width="130" height="30" rx="3" fill="#15897A" fill-opacity="0.1" stroke="#15897A" stroke-width="1.25"/>
<text x="395" y="317" text-anchor="middle" font-weight="600">proj · zero-init</text>
<path d="M395,298 V252 H370 V208" fill="none" stroke="#15897A" stroke-width="1.25" marker-end="url(#dt-b)"/>
<text x="402" y="248" font-size="10.5" font-weight="600" fill="#15897A">K, V</text>
<text x="70" y="350" font-size="10.5" opacity="0.65">at step 0 the projection is all zeros, so changing the caption changes nothing: the model starts text-blind and has to learn to listen</text>
</svg>
